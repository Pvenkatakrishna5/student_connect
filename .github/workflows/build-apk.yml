name: Build Android APK

on: [push]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          cd mobile_app
          npm i
          mkdir -p www
          echo "<!-- dummy -->" > www/index.html
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x ./gradlew
          ./gradlew assembleDebug > ../../build.log 2>&1

      - name: Commit APK or Logs back to branch
        if: always()
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git checkout -b apk-release || git checkout apk-release
          cp mobile_app/android/app/build/outputs/apk/debug/app-debug.apk ./StudentConnect.apk || true
          cp build.log ./build.log || true
          git add StudentConnect.apk build.log || true
          git commit -m "Add compiled APK or logs" || true
          git push -f origin apk-release
