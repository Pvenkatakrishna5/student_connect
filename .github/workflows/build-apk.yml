name: Build Android APK

on: [push]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          cd mobile_app
          npm i
          mkdir -p www
          echo "<!-- dummy -->" > www/index.html
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudentConnect-APK
          path: mobile_app/android/app/build/outputs/apk/debug/app-debug.apk
